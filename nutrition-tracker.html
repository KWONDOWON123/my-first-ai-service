<title>끼니표</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1e9;
    --surface: #ffffff;
    --surface-2: #f6f7f2;
    --line: #cdd4c1;
    --line-strong: #1b2116;
    --ink: #1b2116;
    --ink-muted: #5c6656;
    --ink-faint: #8b9482;
    --accent: #33507a;
    --accent-ink: #ffffff;
    --accent-soft: #e3e9f1;
    --ok: #2e7d4f;
    --ok-soft: #dfefe4;
    --warn: #93650a;
    --warn-soft: #f6ecd6;
    --bad: #a83a24;
    --bad-soft: #f5e0d9;
    --shadow: 0 1px 0 rgba(27,33,22,0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14170f;
      --surface: #1c2118;
      --surface-2: #20261b;
      --line: #38402e;
      --line-strong: #e9ede1;
      --ink: #e9ede1;
      --ink-muted: #a7b09a;
      --ink-faint: #6f7864;
      --accent: #8fadd6;
      --accent-ink: #10151d;
      --accent-soft: #232e3d;
      --ok: #7ec99a;
      --ok-soft: #223226;
      --warn: #e0b45d;
      --warn-soft: #332a17;
      --bad: #e2917c;
      --bad-soft: #3a2018;
      --shadow: 0 1px 0 rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14170f;
    --surface: #1c2118;
    --surface-2: #20261b;
    --line: #38402e;
    --line-strong: #e9ede1;
    --ink: #e9ede1;
    --ink-muted: #a7b09a;
    --ink-faint: #6f7864;
    --accent: #8fadd6;
    --accent-ink: #10151d;
    --accent-soft: #232e3d;
    --ok: #7ec99a;
    --ok-soft: #223226;
    --warn: #e0b45d;
    --warn-soft: #332a17;
    --bad: #e2917c;
    --bad-soft: #3a2018;
    --shadow: 0 1px 0 rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Karla", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    padding: 0 20px 64px;
  }
  h1, h2, h3, .display {
    font-family: "Archivo", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }
  .num, input[type="number"], .tabular {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  .wrap { max-width: 920px; margin: 0 auto; }

  /* ---- top masthead, nutrition-label inspired ---- */
  .masthead {
    padding: 28px 0 14px;
    border-bottom: 4px solid var(--line-strong);
  }
  .masthead-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { font-size: 28px; font-weight: 800; margin: 0; }
  .brand-sub { color: var(--ink-muted); font-size: 13px; margin-top: 4px; }
  .profile-chip {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 8px 6px 14px; box-shadow: var(--shadow);
  }
  .profile-chip .name { font-weight: 700; }
  .profile-chip .meta { color: var(--ink-muted); font-size: 12px; }
  .profile-chip button {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 10px; font-size: 12px; color: var(--ink-muted);
  }
  .profile-chip button:hover { color: var(--ink); border-color: var(--ink-faint); }

  .banner {
    margin-top: 14px; padding: 10px 14px; border-radius: 8px;
    background: var(--warn-soft); color: var(--warn); font-size: 13px;
    border: 1px solid var(--warn);
  }

  /* ---- tabs ---- */
  .tabs { display: flex; gap: 4px; margin: 22px 0 18px; border-bottom: 1px solid var(--line); }
  .tab-btn {
    background: none; border: none; padding: 10px 4px; margin-right: 20px;
    font-family: "Archivo", sans-serif; font-weight: 700; font-size: 15px;
    color: var(--ink-muted); border-bottom: 3px solid transparent; margin-bottom: -1px;
  }
  .tab-btn[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

  /* ---- gate screen ---- */
  .gate { max-width: 480px; margin: 40px auto 0; }
  .gate p.lead { color: var(--ink-muted); font-size: 14px; line-height: 1.7; }
  .gate-section { margin-top: 28px; }
  .gate-section h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-muted); margin: 0 0 10px; }
  .profile-list { display: flex; flex-direction: column; gap: 8px; }
  .profile-row {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; text-align: left; box-shadow: var(--shadow);
  }
  .profile-row:hover { border-color: var(--accent); }
  .profile-row .p-name { font-weight: 700; }
  .profile-row .p-meta { color: var(--ink-muted); font-size: 12px; margin-top: 2px; }
  .profile-row .arrow { color: var(--ink-faint); }
  .empty-note { color: var(--ink-faint); font-size: 13px; padding: 10px 2px; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 12px; font-weight: 700; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .field input[type="text"] {
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
    background: var(--surface); color: var(--ink);
  }
  .radio-row { display: flex; gap: 8px; }
  .radio-pill {
    flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px;
    text-align: center; font-size: 13px; background: var(--surface); position: relative;
  }
  .radio-pill input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .radio-pill.checked { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }

  .btn-primary {
    width: 100%; background: var(--accent); color: var(--accent-ink); border: none;
    border-radius: 8px; padding: 12px; font-weight: 700; font-size: 14px; margin-top: 6px;
  }
  .btn-primary:hover { opacity: 0.92; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---- app layout ---- */
  .app-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 22px; align-items: start; }
  @media (max-width: 760px) { .app-grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 20px; box-shadow: var(--shadow);
  }
  .panel + .panel { margin-top: 18px; }
  .panel h2 { font-size: 15px; margin: 0 0 4px; }
  .panel .sub { color: var(--ink-muted); font-size: 12.5px; margin: 0 0 14px; }

  .date-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .date-row input[type="date"] {
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--surface); color: var(--ink);
  }
  .date-row .today-btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 7px 10px; font-size: 12px; }

  /* add-food form */
  .food-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .food-form-grid .span2 { grid-column: 1 / -1; }
  .food-name-field { position: relative; }
  .suggest-list {
    position: absolute; left: 0; right: 0; top: 100%; margin-top: 4px; z-index: 20;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    max-height: 240px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.14);
  }
  .suggest-item { padding: 8px 12px; cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .suggest-item:hover { background: var(--accent-soft); }
  .suggest-item .s-serving { color: var(--ink-muted); font-size: 11px; white-space: nowrap; }
  .link-chip {
    margin-top: 8px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
    background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 8px;
    padding: 8px 10px; font-size: 12.5px;
  }
  .link-chip label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-muted); text-transform: none; letter-spacing: normal; }
  .link-chip input[type="number"] { width: 60px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
  .link-chip button { margin-left: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; font-size: 11.5px; color: var(--ink-muted); }
  .link-chip button:hover { color: var(--ink); border-color: var(--ink-faint); }
  .food-form-grid input, .food-form-grid select {
    width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px;
    background: var(--surface-2); color: var(--ink);
  }
  .food-form-grid label { display: block; font-size: 11px; color: var(--ink-muted); margin-bottom: 4px; }
  .add-btn {
    margin-top: 14px; background: var(--ink); color: var(--surface); border: none;
    border-radius: 8px; padding: 10px 16px; font-weight: 700; font-size: 13px;
  }
  @media (prefers-color-scheme: dark) { .add-btn { background: var(--accent); color: var(--accent-ink); } }
  :root[data-theme="dark"] .add-btn { background: var(--accent); color: var(--accent-ink); }

  /* food list */
  .meal-group { margin-top: 18px; }
  .meal-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-muted); border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 8px; }
  .food-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); gap: 10px; }
  .food-item:last-child { border-bottom: none; }
  .food-item .fi-name { font-weight: 600; }
  .food-item .fi-nums { color: var(--ink-muted); font-size: 12px; }
  .food-item .fi-del { background: none; border: none; color: var(--ink-faint); font-size: 16px; padding: 2px 6px; }
  .food-item .fi-del:hover { color: var(--bad); }
  .no-items { color: var(--ink-faint); font-size: 13px; padding: 6px 0; }

  /* nutrient gauge rows */
  .summary-line { font-size: 13.5px; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; font-weight: 600; }
  .summary-line[data-tone="ok"] { background: var(--ok-soft); color: var(--ok); }
  .summary-line[data-tone="warn"] { background: var(--warn-soft); color: var(--warn); }

  .nrow { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .nrow:last-child { border-bottom: none; }
  .nrow-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .nlabel { font-weight: 700; font-size: 13.5px; }
  .chip { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .chip[data-tone="ok"] { background: var(--ok-soft); color: var(--ok); }
  .chip[data-tone="warn"] { background: var(--warn-soft); color: var(--warn); }
  .chip[data-tone="bad"] { background: var(--bad-soft); color: var(--bad); }

  .gauge { position: relative; height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .gauge-zone { position: absolute; top: 0; bottom: 0; background: var(--accent-soft); }
  .gauge-fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 999px 0 0 999px; transition: width 0.25s ease; }
  .gauge-fill[data-tone="ok"] { background: var(--ok); }
  .gauge-fill[data-tone="warn"] { background: var(--warn); }
  .gauge-fill[data-tone="bad"] { background: var(--bad); }

  .nrow-nums { display: flex; justify-content: space-between; margin-top: 5px; font-size: 12px; color: var(--ink-muted); }
  .nrow-nums .consumed { color: var(--ink); font-weight: 600; }

  /* history */
  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .history-row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; text-align: left; box-shadow: var(--shadow);
  }
  .history-row:hover { border-color: var(--accent); }
  .history-row .h-date { font-weight: 700; font-family: "IBM Plex Mono", monospace; }
  .history-row .h-kcal { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
  .dot-row { display: flex; gap: 4px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot[data-tone="ok"] { background: var(--ok); }
  .dot[data-tone="warn"] { background: var(--warn); }
  .dot[data-tone="bad"] { background: var(--bad); }

  .footnote { margin-top: 32px; color: var(--ink-faint); font-size: 11.5px; line-height: 1.7; border-top: 1px solid var(--line); padding-top: 14px; }
</style>

<div class="wrap" id="app"></div>

  var FOOD_SEARCH_INDEX = FOOD_DB.map(function (f) {
    var terms = [f.name].concat(f.aliases || []).map(function (s) { return s.toLowerCase(); });
    return { food: f, terms: terms };
  });

  function searchFood(query) {
    var q = String(query || '').trim().toLowerCase();
    if (!q) return [];
    var matches = [];
    for (var i = 0; i < FOOD_SEARCH_INDEX.length; i++) {
      var entry = FOOD_SEARCH_INDEX[i];
      for (var j = 0; j < entry.terms.length; j++) {
        if (entry.terms[j].indexOf(q) !== -1) { matches.push(entry.food); break; }
      }
      if (matches.length >= 8) break;
    }
    return matches;
  }

  var FOOD_FIELD_IDS = { kcal: 'f-kcal', carb: 'f-carb', protein: 'f-protein', fat: 'f-fat', satfat: 'f-satfat', sugar: 'f-sugar', sodium: 'f-sodium', fiber: 'f-fiber' };
  function roundForField(key, v) { return (key === 'kcal' || key === 'sodium') ? Math.round(v) : round1(v); }
  function fillNutrientsFromFood(food, qty) {
    Object.keys(FOOD_FIELD_IDS).forEach(function (key) {
      var el = document.getElementById(FOOD_FIELD_IDS[key]);
      if (el) el.value = roundForField(key, (food[key] || 0) * qty);
    });
  }

  function groupKey(gender, ageBand) { return gender + "-" + ageBand; }
  function groupLabel(gender, ageBand) {
    return (ageBand === "1929" ? "20대" : "30대") + " " + (gender === "M" ? "남성" : "여성");
  }

  // ---------------------------------------------------------------
  // Judgement + gauge model
  // ---------------------------------------------------------------
  function judge(kind, target, consumed) {
    if (kind === "band") {
      var low = target * 0.9, high = target * 1.1;
      if (consumed < low) return "warn";
      if (consumed > high) return "bad";
      return "ok";
    }
    if (kind === "range") {
      if (consumed < target[0]) return "warn";
      if (consumed > target[1]) return "bad";
      return "ok";
    }
    if (kind === "maxOnly") return consumed > target ? "bad" : "ok";
    if (kind === "minOnly") return consumed < target ? "warn" : "ok";
    return "ok";
  }

  function statusLabel(kind, tone) {
    if (kind === "maxOnly") return tone === "bad" ? "초과" : "정상";
    if (kind === "minOnly") return tone === "warn" ? "부족" : "정상";
    return tone === "ok" ? "적정" : (tone === "warn" ? "부족" : "초과");
  }

  function targetText(nut, target) {
    if (nut.kind === "range") return target[0] + "~" + target[1] + " " + nut.unit;
    if (nut.kind === "maxOnly") return target + " " + nut.unit + " 이하";
    if (nut.kind === "minOnly") return target + " " + nut.unit + " 이상";
    return target + " " + nut.unit;
  }

  function gaugeModel(kind, target, consumed) {
    var zoneMin, zoneMax;
    if (kind === "band") { zoneMin = target * 0.9; zoneMax = target * 1.1; }
    else if (kind === "range") { zoneMin = target[0]; zoneMax = target[1]; }
    else if (kind === "maxOnly") { zoneMin = 0; zoneMax = target; }
    else { zoneMin = target; zoneMax = target; } // minOnly: zone opens to the right edge

    var scaleMax = Math.max(zoneMax * 1.25, consumed * 1.1, 1);
    if (kind === "minOnly") scaleMax = Math.max(target * 1.6, consumed * 1.1, 1);
    var pct = function (v) { return Math.max(0, Math.min(100, (v / scaleMax) * 100)); };
    var zoneEndPct = kind === "minOnly" ? 100 : pct(zoneMax);
    return { zoneStartPct: pct(zoneMin), zoneEndPct: zoneEndPct, fillPct: pct(consumed) };
  }

  // Small utils
  // ---------------------------------------------------------------
  function uid(prefix) {
    return (prefix || "id") + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function todayStr() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }
  function fmtDate(s) {
    var p = s.split("-");
    return p[0] + "년 " + parseInt(p[1], 10) + "월 " + parseInt(p[2], 10) + "일";
  }
  function num(v) { var n = Number(v); return isFinite(n) && n >= 0 ? n : 0; }
  function sumItems(items, key) {
    return items.reduce(function (acc, it) { return acc + num(it[key]); }, 0);
  }
  function round1(v) { return Math.round(v * 10) / 10; }

    } catch (e) { return { profiles: {}, entries: {} }; }
  }
  function saveLocal(data) {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); } catch (e) {}
  }

      }
      return window.claude.use("db").then(function (db) {
        if (db) { self.db = db; self.mode = "shared"; }
        else { self.mode = "local"; }
      }).catch(function () { self.mode = "local"; });
    },

    listProfiles: function (onChange) {
      if (this.mode === "shared") {
        return this.db.collection("profiles").orderBy("createdAt", "asc").limit(200)
          .onSnapshot(function (snap) {
            onChange(snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }));
          }, function () { onChange([]); });
      }
      var data = loadLocal();
      var list = Object.keys(data.profiles).map(function (id) {
        return Object.assign({ id: id }, data.profiles[id]);
      }).sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
      onChange(list);
      return function () {};
    },

    createProfile: function (profile) {
      var id = uid("p");
      var body = Object.assign({ createdAt: Date.now() }, profile);
      if (this.mode === "shared") {
        return this.db.doc("profiles/" + id).set(body).then(function () { return id; });
      }
      var data = loadLocal();
      data.profiles[id] = body;
      saveLocal(data);
      return Promise.resolve(id);
    },

    entryDocId: function (profileId, date) { return profileId + "__" + date; },

    watchEntry: function (profileId, date, onChange) {
      var id = this.entryDocId(profileId, date);
      if (this.mode === "shared") {
        return this.db.doc("entries/" + id).onSnapshot(function (snap) {
          onChange(snap.exists ? snap.data().items || [] : []);
        }, function () { onChange([]); });
      }
      var data = loadLocal();
      onChange((data.entries[id] && data.entries[id].items) || []);
      return function () {};
    },

    saveEntry: function (profileId, date, items) {
      var id = this.entryDocId(profileId, date);
      if (this.mode === "shared") {
        return this.db.doc("entries/" + id).set({ profileId: profileId, date: date, items: items, updatedAt: Date.now() });
      }
      var data = loadLocal();
      data.entries[id] = { profileId: profileId, date: date, items: items, updatedAt: Date.now() };
      saveLocal(data);
      return Promise.resolve();
    },

    history: function (profileId, limitN) {
      if (this.mode === "shared") {
        return this.db.collection("entries").where("profileId", "==", profileId)
          .orderBy("date", "desc").limit(limitN || 60).get()
          .then(function (snap) { return snap.docs.map(function (d) { return d.data(); }); });
      }
      var data = loadLocal();
      var list = Object.keys(data.entries)
        .map(function (k) { return data.entries[k]; })
        .filter(function (e) { return e.profileId === profileId; })
        .sort(function (a, b) { return a.date < b.date ? 1 : -1; })
        .slice(0, limitN || 60);
      return Promise.resolve(list);
    }
  };

  function escapeHtml(s) {

  // ---------------------------------------------------------------
  // Events
  // ---------------------------------------------------------------
  function bindEvents() {
    var newProfileForm = document.getElementById("new-profile-form");
    if (newProfileForm) {
      root.querySelectorAll('[data-radio-group]').forEach(function (label) {
        label.addEventListener("click", function () {
          var group = label.getAttribute("data-radio-group");
          var value = label.getAttribute("data-radio-value");
          if (group === "age") state.newAge = value; else state.newGender = value;
          render();
        });
      });
      newProfileForm.addEventListener("submit", function (e) {
        e.preventDefault();
        var name = document.getElementById("np-name").value.trim();
        if (!name) return;
        Store.createProfile({ name: name, ageBand: state.newAge, gender: state.newGender }).then(function (id) {
          localStorage.setItem(PROFILE_KEY, id);
          enterProfile({ id: id, name: name, ageBand: state.newAge, gender: state.newGender });
        });
      });
      root.querySelectorAll("[data-select]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-select");
          var p = state.profiles.find(function (x) { return x.id === id; });
          if (!p) return;
          localStorage.setItem(PROFILE_KEY, id);
          enterProfile(p);
        });
      });
      return;
    }

    var switchBtn = root.querySelector('[data-action="switch-profile"]');
    if (switchBtn) switchBtn.addEventListener("click", function () {
      localStorage.removeItem(PROFILE_KEY);
      if (unsubEntry) unsubEntry();
      state.profile = null;
      state.items = [];
      render();
    });

    root.querySelectorAll("[data-tab]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.tab = btn.getAttribute("data-tab");
        if (state.tab === "history") loadHistory();
        render();
      });
    });

    var dateInput = document.getElementById("date-input");
    if (dateInput) dateInput.addEventListener("change", function () {
      loadEntry(dateInput.value);
    });
    var goToday = root.querySelector('[data-action="go-today"]');
    if (goToday) goToday.addEventListener("click", function () { loadEntry(todayStr()); });

    var mealSelect = document.getElementById("f-meal");
    if (mealSelect) mealSelect.addEventListener("change", function () {
      state.selectedMeal = mealSelect.value;
    });

    var nameInput = document.getElementById("f-name");
    var suggestBox = document.getElementById("food-suggest");
    var chipBox = document.getElementById("food-link-chip");
    var linkedFood = null;

    function hideSuggest() {
      if (suggestBox) { suggestBox.hidden = true; suggestBox.innerHTML = ""; }
    }

    function showChip(food, qty) {
      if (!chipBox) return;
      chipBox.hidden = false;
      chipBox.innerHTML = '<span>🔗 <b>' + escapeHtml(food.name) + '</b> · ' + escapeHtml(food.servingDesc) + ' 기준</span>' +
        '<label>인분(배수) <input type="number" id="f-qty" min="0.1" step="0.1" value="' + qty + '"></label>' +
        '<button type="button" id="f-unlink">수동 입력으로 전환</button>';
      var qtyInput = document.getElementById("f-qty");
      qtyInput.addEventListener("input", function () {
        var q = parseFloat(qtyInput.value);
        if (!isFinite(q) || q < 0) return;
        fillNutrientsFromFood(food, q);
      });
      document.getElementById("f-unlink").addEventListener("click", function () {
        linkedFood = null;
        chipBox.hidden = true;
        chipBox.innerHTML = "";
      });
    }

    function selectFood(food) {
      linkedFood = food;
      nameInput.value = food.name;
      hideSuggest();
      fillNutrientsFromFood(food, 1);
      showChip(food, 1);
    }

    // ---- 여러 음식을 한번에 입력하면(쉼표/plus로 구분) 즉시 합산 ----
    var COMBO_SEP_RE = /[,、，+]/;
    function matchFoodExact(token) {
      var t = String(token || "").trim().toLowerCase();
      if (!t) return null;
      for (var i = 0; i < FOOD_SEARCH_INDEX.length; i++) {
        if (FOOD_SEARCH_INDEX[i].terms.indexOf(t) !== -1) return FOOD_SEARCH_INDEX[i].food;
      }
      return null;
    }
    function matchFoodBest(token) {
      return matchFoodExact(token) || searchFood(token)[0] || null;
    }
    function computeCombo(tokens) {
      var matched = [], unmatched = [];
      tokens.forEach(function (tok) {
        var t = tok.trim();
        if (!t) return;
        var food = matchFoodBest(t);
        if (food) matched.push(food); else unmatched.push(t);
      });
      var sums = {};
      Object.keys(FOOD_FIELD_IDS).forEach(function (key) { sums[key] = 0; });
      matched.forEach(function (food) {
        Object.keys(FOOD_FIELD_IDS).forEach(function (key) { sums[key] += food[key] || 0; });
      });
      return { matched: matched, unmatched: unmatched, sums: sums };
    }
    function showComboChip(combo, qty) {
      if (!chipBox) return;
      chipBox.hidden = false;
      var namesHtml = combo.matched.map(function (f) { return escapeHtml(f.name); }).join(" + ") || "(매칭된 음식 없음)";
      var warnHtml = combo.unmatched.length
        ? ' <span style="color:var(--bad)">· 못 찾음: ' + escapeHtml(combo.unmatched.join(", ")) + ' (해당 칸은 직접 입력해주세요)</span>'
        : "";
      chipBox.innerHTML = '<span>🔗 <b>' + namesHtml + '</b> 합산' + warnHtml + '</span>' +
        '<label>배수 <input type="number" id="f-qty" min="0.1" step="0.1" value="' + qty + '"></label>' +
        '<button type="button" id="f-unlink">수동 입력으로 전환</button>';
      var qtyInput = document.getElementById("f-qty");
      qtyInput.addEventListener("input", function () {
        var q = parseFloat(qtyInput.value);
        if (!isFinite(q) || q < 0) return;
        fillNutrientsFromFood(combo.sums, q);
      });
      document.getElementById("f-unlink").addEventListener("click", function () {
        linkedFood = null;
        chipBox.hidden = true;
        chipBox.innerHTML = "";
      });
    }

    if (nameInput) {
      nameInput.addEventListener("input", function () {
        var raw = nameInput.value;
        if (COMBO_SEP_RE.test(raw)) {
          hideSuggest();
          var tokens = raw.split(COMBO_SEP_RE).map(function (s) { return s.trim(); }).filter(Boolean);
          var combo = tokens.length ? computeCombo(tokens) : null;
          if (combo && combo.matched.length) {
            linkedFood = { combo: true };
            fillNutrientsFromFood(combo.sums, 1);
            showComboChip(combo, 1);
          } else if (chipBox) {
            linkedFood = null;
            chipBox.hidden = true;
            chipBox.innerHTML = "";
          }
          return;
        }
        var matches = searchFood(raw);
        if (!matches.length) { hideSuggest(); return; }
        suggestBox.innerHTML = matches.map(function (f) {
          var idx = FOOD_DB.indexOf(f);
          var tagText = (f.cuisine ? f.cuisine + " · " : "") + f.servingDesc;
          return '<div class="suggest-item" data-food-idx="' + idx + '">' +
            '<span>' + escapeHtml(f.name) + '</span><span class="s-serving">' + escapeHtml(tagText) + '</span></div>';
        }).join("");
        suggestBox.hidden = false;
        suggestBox.querySelectorAll("[data-food-idx]").forEach(function (row) {
          row.addEventListener("mousedown", function (e) {
            e.preventDefault();
            var idx = parseInt(row.getAttribute("data-food-idx"), 10);
            selectFood(FOOD_DB[idx]);
          });
        });
      });
      nameInput.addEventListener("blur", function () { setTimeout(hideSuggest, 120); });
      nameInput.addEventListener("keydown", function (e) { if (e.key === "Escape") hideSuggest(); });
    }

    Object.keys(FOOD_FIELD_IDS).forEach(function (key) {
      var el = document.getElementById(FOOD_FIELD_IDS[key]);
      if (el) el.addEventListener("input", function () {
        if (linkedFood) {
          linkedFood = null;
          if (chipBox) { chipBox.hidden = true; chipBox.innerHTML = ""; }
        }
      });
    });

    var foodForm = document.getElementById("food-form");
    if (foodForm) foodForm.addEventListener("submit", function (e) {
      e.preventDefault();
      var name = document.getElementById("f-name").value.trim();
      if (!name) return;
      var item = {
        id: uid("i"),
        meal: document.getElementById("f-meal").value,
        name: name,
        kcal: num(document.getElementById("f-kcal").value),
        carb: num(document.getElementById("f-carb").value),
        protein: num(document.getElementById("f-protein").value),
        fat: num(document.getElementById("f-fat").value),
        satfat: num(document.getElementById("f-satfat").value),
        sugar: num(document.getElementById("f-sugar").value),
        sodium: num(document.getElementById("f-sodium").value),
        fiber: num(document.getElementById("f-fiber").value)
      };
      var next = state.items.concat([item]);
      Store.saveEntry(state.profile.id, state.date, next).then(function () {
        if (Store.mode === "local") { state.items = next; render(); }
      });
    });

    root.querySelectorAll("[data-del-item]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-del-item");
        var next = state.items.filter(function (it) { return it.id !== id; });
        Store.saveEntry(state.profile.id, state.date, next).then(function () {
          if (Store.mode === "local") { state.items = next; render(); }
        });
      });
    });

    root.querySelectorAll("[data-history-date]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var date = btn.getAttribute("data-history-date");
        state.tab = "today";
        loadEntry(date);
      });
    });
  }

  // ---------------------------------------------------------------
  // Data loading
  // ---------------------------------------------------------------
  function loadEntry(date) {
    if (unsubEntry) unsubEntry();
    state.date = date;
    unsubEntry = Store.watchEntry(state.profile.id, date, function (items) {
      state.items = items;
      render();
    });
  }

  function loadHistory() {
    Store.history(state.profile.id, 90).then(function (list) {
      state.history = list;
      render();
    });
  }

  function enterProfile(p) {
    state.profile = p;
    if (unsubProfiles) { unsubProfiles(); unsubProfiles = null; }
    loadEntry(todayStr());
    render();
  }

  // ---------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------
  function boot() {
    Store.init().then(function () {
      var savedId = null;
      try { savedId = localStorage.getItem(PROFILE_KEY); } catch (e) {}

      unsubProfiles = Store.listProfiles(function (profiles) {
        state.profiles = profiles;
        if (!state.booted) {
          state.booted = true;
          if (savedId) {
            var mine = profiles.find(function (p) { return p.id === savedId; });
            if (mine) { enterProfile(mine); return; }
          }
          render();
        } else if (!state.profile) {
          render();
        }
      });
    });
  }

  boot();
})();
</script>
